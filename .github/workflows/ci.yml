name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test grammar and build WASM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Preserve committed WASM artifact
        run: cp tree-sitter-python.wasm /tmp/tree-sitter-python.wasm
      - name: Build WASM
        run: make build
      - name: Verify committed WASM artifact is current
        run: cmp --silent /tmp/tree-sitter-python.wasm tree-sitter-python.wasm
